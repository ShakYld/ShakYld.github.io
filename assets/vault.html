<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>vault</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{--bg:#0b0d13;--ink:#e2e6f0;--muted:#8490a4;--accent:oklch(.70 .17 178);--accent-glow:oklch(.70 .17 178/.20);--line:rgba(226,230,240,.12)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  main{max-width:520px;width:100%;border:1px solid var(--line);border-radius:2px;padding:32px;background:rgba(226,230,240,.03);box-shadow:0 0 40px var(--accent-glow)}
  p{color:var(--muted);font-size:.9rem;line-height:1.6;margin:0 0 16px}
  code{display:block;color:var(--accent);font-size:1.05rem;font-weight:700;padding:14px 16px;border:1px solid var(--line);border-radius:2px;background:rgba(226,230,240,.04);letter-spacing:.02em}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<main>
  <p>&gt; crawlers were told not to come here. you're not a crawler.</p>
  <code>flag{r0b0ts_d0nt_l13}</code>
  <p style="margin-top:16px;">Take this back to <a href="../ctf.html">the flag hunt</a>.</p>
